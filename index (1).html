            /* margin-left: .255em; */

        // code=TOI&date=2025-5-25

        $(document).ready(function () {

            //------------------------------------------------

            // if (hour < 12) {

            // } else if (hour < 18) {

            //     greeting = "Good Evening";
            // }

            // $("#lblGreeting").text(greeting);

            $("#lblGreeting").text("Login");

            //------------------------------------------------

            //url verification based on current date http:....../puzzleme.html?code=TOI&date=2024-6-25

            const urlVerification = () => {
                const urlParams = new URLSearchParams(window.location.search);
                const code = urlParams.get('code');
                const date = urlParams.get('date');

                const today = new Date();
                const yyyy = today.getFullYear();
                const mm = String(today.getMonth() + 1).padStart(2, '0'); // Months start at 0!
                const dd = String(today.getDate()).padStart(2, '0');
                const currentDate = `${yyyy}-${mm}-${dd}`;

                // console.log(currentDate, date);

                if (date !== currentDate) {
                    $("#randomTagline").html("Looks like you scanned an older QR code. Please scan the QR from today’s TOI edition to continue.");
                    $("#startBtn").hide();
                }
                else {
                    $("#randomTagline").html("FLIP THE WORDS. <br>CRACK THE LOGIC.  <br>BEAT THE CLOCK.");
                    // var lines = [
                    //     "FLIP THE WORDS. CRACK THE LOGIC. BEAT THE CLOCK.",
                    //     "Every second counts. Every flip matters.",
                    //     "Think fast. Flip faster.",
                    //     "Ready to twist words and tame time?",
                    //     "Let’s see how quickly your brain flips into action."
                    // ];

                    // // Generate random index
                    // var randomIndex = Math.floor(Math.random() * lines.length);

                    // // Set random line to label
                    // $("#randomTagline").text(lines[randomIndex]);
                }

            };

            urlVerification();

            //------------------------------------------------

            let userData = {};

            userData = JSON.parse(localStorage.getItem("session"));


            function showScreen(id) {

                userData = JSON.parse(localStorage.getItem("session"));
                if (userData) {
                    $(".lblMSg").html(userData.name ? "Welcome, <br>" + userData.name : "");
                }
                else {
                    $(".lblMSg").html("");
                    $(".dropdown").hide();
                }

                if (id !== "#gameBox") {
                    hideParentTimer();
                }

                $(".screen").hide();
                $(id).show();
            }
            //------------------------------------------------

            // function generateHash(userId) {
            //     return btoa(userId);
            // }

            function showGame() {
                userData = JSON.parse(localStorage.getItem("session"));



                let url = "";
                // url = "https://cdn-in.amuselabs.com/nexus/date-picker?idx=1&set=nexus-toi-synant-puzzles";
                // url = "https://cdn-in.amuselabs.com/nexus/crossword?id=efa3f006&set=nexus-toi-synant-puzzles";
                // url = "https://puzzleme.amuselabs.com/pmm/date-picker?set=puzzlewizards-toi-scan-the-o&embed=1&idx=1"; // testing
                // url = "https://puzzleme.amuselabs.com/pmm/date-picker?set=demo-crossword&embed=1&idx=1" // testing
                // url = "https://cdn-in.amuselabs.com/nexus/crossword?id=98136225&set=nexus-toi-synant-puzzles" // testing
                // url = "https://cdn-in.amuselabs.com/nexus/crossword?id=db6f025d&set=nexus-toi-synant-puzzles" // testing
                // url = "https://cdn-in.amuselabs.com/nexus/crossword?id=30dc7d86&set=nexus-toi-synant-puzzles" // testing
                // url = "https://cdn-in.amuselabs.com/nexus/crossword?id=36d917b6&set=nexus-toi-synant-puzzles" // testing
                // url = "https://cdn-in.amuselabs.com/nexus/crossword?id=efa3f006&set=nexus-toi-synant-puzzles" // testing
                // url ="https://cdn-in.amuselabs.com/nexus/crossword?id=54b30765&set=nexus-toi-synant-puzzles"



                 url = "https://puzzleme.amuselabs.com/pmm/crossword?id=eec36aba&set=puzzlewizards-toi-scan-the-o"; // production

                // userData.id convert to string

                $("#gameFrame").attr("src", url + "&uid=" + userData.id);
                showScreen("#gameBox");
            }

            /* ---------- START ---------- */

            showScreen("#startBox");

            $("#startBtn").click(function () {

                // need to hide image img-logo-toi and show image img-logo-flippit
                $("#img-logo-toi").addClass("d-none");
                $("#img-logo-flippit").removeClass("d-none");
                let userData = JSON.parse(localStorage.getItem("session"));

                if (userData == null || Object.keys(userData).length === 0) {
                    showScreen("#mobileBox");
                } else {
                    if (userData.name) {
                        showGame();
                    }
                    else {
                        showScreen("#usernameBox");
                    }
                }

            });

            /* ---------- LOGIN ---------- */

            $("#sendOtpBtn").click(function () {

                let phone = $("#mobileInput").val().trim();

                if (!phone) {
                    alert("Please enter mobile number");
                    return;
                }

                // let phoneMasked = phone.slice(0, 2) + "XXXXXX" + phone.slice(-2);

                $("#sendOtpBtn").prop("disabled", true).text("Sending...");


                $.ajax({
                    url: "https://zr84sznqb5.execute-api.ap-south-1.amazonaws.com/send-otp",
                    method: "POST",
                    contentType: "application/json",
                    data: JSON.stringify({
                        phone: phone
                    }),
                    success: function (response) {
                        $("#sendOtpBtn").prop("disabled", false).text("Get OTP");
                        $("#screenEnterOTP").show();
                        // $(".lblMobileNumber").html(phoneMasked);
                        // showScreen("#otpBox");
                    },
                    error: function (error) {
                        console.log(error);
                        $("#sendOtpBtn").prop("disabled", false).text("Get OTP");
                    }
                });
                // showScreen("#otpBox");

            });

            // $("#changeNoBtn, #changeNoBtn2").click(function () {
            //     showScreen("#mobileBox");
            //     $("#sendOtpBtn").prop("disabled", false).text("Send OTP");
            // });

            $("#verifyOtpBtn").click(function () {

                let phone = $("#mobileInput").val().trim();
                let otp = $("#otpInput").val();

                if (!otp) {
                    alert("Please enter OTP");
                    return;
                }



                $.ajax({
                    url: "https://zr84sznqb5.execute-api.ap-south-1.amazonaws.com/verify-otp",
                    method: "POST",
                    contentType: "application/json",
                    data: JSON.stringify({
                        phone,
                        otp
                    }),
                    success: function (response) {

                        let letData = {};

                        let FirstTimeUser = response.FirstTimeUser;
                        letData.id = response.UserId;
                        letData.token = response.token;

                        if (FirstTimeUser) {
                            localStorage.setItem("session", JSON.stringify(letData));
                            // showScreen("#usernameBox");
                            $("#screenEnterName").show();
                        } else if (!response.UserName) {
                            localStorage.setItem("session", JSON.stringify(letData));
                            // showScreen("#usernameBox");
                            $("#screenEnterName").show();
                        } else {
                            letData.name = response.UserName;
                            localStorage.setItem("session", JSON.stringify(letData));
                            showGame();
                        }

                    },
                    error: function (error) {
                        // console.log(error);
                        alert("Invalid OTP");
                        // showScreen("#invalidOtpBox");
                        return;
                    }
                });

            });

            // $("#resendOtpBtn").click(function () {
            //     showScreen("#otpBox");
            // });

            /* ---------- REGISTER ---------- */

            $("#registerBtn").click(function () {
                let userData = JSON.parse(localStorage.getItem("session"));
                let username = $("#usernameInput").val();
                let userToken = userData.token;

                if (!username) {
                    alert("Please enter Fullname");
                    return;
                }

                $.ajax({
                    url: "https://zr84sznqb5.execute-api.ap-south-1.amazonaws.com/save-user",
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + userToken
                    },
                    data: JSON.stringify({
                        user_name: username
                    }),
                    success: function (response) {
                        userData.name = username;
                        localStorage.setItem("session", JSON.stringify(userData));
                        showGame();
                    },
                    error: function (error) {
                        console.log(error);
                        alert("Error registering Fullname. Please try again.");
                    }
                });
            });

        });

        const getResult = async () => {
            let userData = JSON.parse(localStorage.getItem("session"));
            const userId = userData.id;
            await $.ajax({
                url: "https://zr84sznqb5.execute-api.ap-south-1.amazonaws.com/user/" + userId,
                type: "GET",
                success: function (response) {

                    var logs = response.gameLogs || [];
                    $("#gameFrame").css("visibility", "visible");

                    if (logs.length === 0) {
                        return;
                    }

                    const latestLog = [...logs].sort(function (a, b) {
                        return new Date(b.created_at) - new Date(a.created_at);
                    })[0];

                    if (latestLog && latestLog.status === "expired") {
                        triggerPuzzleExpiry(latestLog.g_id);
                        return;
                    }

                    ReadData(logs);
                    // console.log(data.gameLogs);


                },
                error: function (err) {
                    console.log("API Error:", err);
                }
            });
        }

        const getResultDummy = async () => {
            fetch('dummy.json')
                .then(response => response.json())
                .then(data => {
                    ReadData(data.gameLogs);
                    console.log(data.gameLogs);
                })
                .catch(error => {
                    console.error('Error loading JSON:', error);
                });

        }

        function userResult(score, time) {

            score = Number(score) || 0;
            time = Number(time) || 0;

            // console.log(time);

            if (time >= 60) {
                return 0;
            }

            if (time == 0) {
                return '-';
            }

            if (score >= 40) {
                score = 40;
            }

            return (59 - time) + score;
        }

        const ReadData = (gameData) => {
            if (gameData.length === 0) return;

            const getISTDateString = (dateValue) => {
                const formatter = new Intl.DateTimeFormat("en-CA", {
                    timeZone: "Asia/Kolkata",
                    year: "numeric",
                    month: "2-digit",
                    day: "2-digit"
                });

                const parts = formatter.formatToParts(new Date(dateValue));
                const year = parts.find(part => part.type === "year")?.value;
                const month = parts.find(part => part.type === "month")?.value;
                const day = parts.find(part => part.type === "day")?.value;

                return `${year}-${month}-${day}`;
            };

            const getDayDifference = (laterDate, earlierDate) => {
                const later = new Date(`${laterDate}T00:00:00Z`);
                const earlier = new Date(`${earlierDate}T00:00:00Z`);
                return Math.round((later - earlier) / (1000 * 60 * 60 * 24));
            };

            // Sort latest first
            gameData.sort(function (a, b) {
                return new Date(b.created_at) - new Date(a.created_at);
            });

            // 1️⃣ Filter only completed games
            let completedGames = gameData.filter(g => g.status === "completed");

            if (completedGames.length === 0) {
                return;
            }

            //------------> Timetaken
            // 2️⃣ Latest time taken (only from completed)
            let timeTaken = completedGames[0].time_taken || 0;
            msgResultTop(timeTaken);

            //------------> Score
            let score = userResult(completedGames[0].score, timeTaken)

            // 3️⃣ Total games played
            let totalFlip = gameData.length;

            //------------> Total wins
            // 4️⃣ Total wins
            let totalWins = Math.round(completedGames.length / totalFlip * 100) + "%";


            // winCalculation

            // 5️⃣ Calculate streaks
            let completedDates = completedGames
                .filter(g => g.updated_at)
                .map(g => getISTDateString(g.updated_at));

            let uniqueCompletedDates = [...new Set(completedDates)].sort((a, b) => {
                return new Date(b) - new Date(a);
            });

            let liveStreak = 0;
            let bestStreak = 0;

            if (uniqueCompletedDates.length > 0) {
                const today = getISTDateString(new Date());
                const latestCompletedDate = uniqueCompletedDates[0];

                if (latestCompletedDate === today) {
                    liveStreak = 1;
                } else if (getDayDifference(today, latestCompletedDate) === 1) {
                    liveStreak = 1;
                }

                for (let i = 1; i < uniqueCompletedDates.length && liveStreak > 0; i++) {
                    if (getDayDifference(uniqueCompletedDates[i - 1], uniqueCompletedDates[i]) === 1) {
                        liveStreak += 1;
                    } else {
                        break;
                    }
                }

                let ascendingDates = [...uniqueCompletedDates].sort((a, b) => {
                    return new Date(a) - new Date(b);
                });

                let currentStreak = 1;
                bestStreak = 1;

                for (let i = 1; i < ascendingDates.length; i++) {
                    if (getDayDifference(ascendingDates[i], ascendingDates[i - 1]) === 1) {
                        currentStreak += 1;
                    } else {
                        currentStreak = 1;
                    }

                    if (currentStreak > bestStreak) {
                        bestStreak = currentStreak;
                    }
                }
            }
            let resultData = {
                seconds: timeTaken,
                totalFlip: totalFlip,
                totalWins: totalWins,
                score: score,
                liveStreak: liveStreak,
                bestStreak: bestStreak
            };

            showResultPopup(resultData);

        };

        let puzzleExpiryTimerId = null;
        let puzzleCountdownIntervalId = null;
        let puzzleExpiryHandled = false;
        let activePuzzleId = null;
        let activePuzzleExpiryAtMs = null;

        function clearPuzzleExpiryTimer() {
            if (puzzleExpiryTimerId) {
                clearTimeout(puzzleExpiryTimerId);
                puzzleExpiryTimerId = null;
            }
        }

        function hideParentTimer() {
            clearPuzzleExpiryTimer();

            if (puzzleCountdownIntervalId) {
                clearInterval(puzzleCountdownIntervalId);
                puzzleCountdownIntervalId = null;
            }

            activePuzzleId = null;
            activePuzzleExpiryAtMs = null;
            $("#parentTimerWrap").hide();
            $("#parentTimerValue").text("01:00");
        }

        function formatCountdown(ms) {
            const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
            const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, "0");
            const seconds = String(totalSeconds % 60).padStart(2, "0");
            return `${minutes}:${seconds}`;
        }

        function updateParentTimerDisplay() {
            if (!activePuzzleExpiryAtMs) {
                return;
            }

            const remainingMs = Math.max(0, activePuzzleExpiryAtMs - Date.now());
            $("#parentTimerWrap").css("display", "flex");
            $("#parentTimerValue").text(formatCountdown(remainingMs));
        }

        function startParentTimer(gameId, createdAtMs) {
            activePuzzleId = gameId;
            activePuzzleExpiryAtMs = createdAtMs + 60000;

            if (puzzleCountdownIntervalId) {
                clearInterval(puzzleCountdownIntervalId);
            }

            updateParentTimerDisplay();

            puzzleCountdownIntervalId = setInterval(function () {
                updateParentTimerDisplay();

                if (activePuzzleExpiryAtMs && Date.now() >= activePuzzleExpiryAtMs) {
                    clearInterval(puzzleCountdownIntervalId);
                    puzzleCountdownIntervalId = null;

                    if (activePuzzleId) {
                        checkAndExpirePuzzle(activePuzzleId);
                    }
                }
            }, 250);
        }

        async function fetchLatestGameLogForPuzzle(userId, gameId) {
            return $.ajax({
                url: "https://zr84sznqb5.execute-api.ap-south-1.amazonaws.com/user/" + userId,
                type: "GET"
            }).then(function (response) {
                const logs = response.gameLogs || [];

                return logs.sort(function (a, b) {
                    return new Date(b.created_at) - new Date(a.created_at);
                })[0] || null;
            }).catch(function (err) {
                console.log("API Error:", err);
                return null;
            });
        }

        function schedulePuzzleExpiryCheck(delayMs, gameId) {
            clearPuzzleExpiryTimer();
            puzzleExpiryTimerId = setTimeout(function () {
                checkAndExpirePuzzle(gameId);
            }, Math.max(0, delayMs));
        }

        async function checkAndExpirePuzzle(gameId) {
            if (puzzleExpiryHandled) {
                return;
            }

            const userData = JSON.parse(localStorage.getItem("session"));
            if (!userData) {
                return;
            }

            const latestGameLog = await fetchLatestGameLogForPuzzle(userData.id, gameId);

            if (!latestGameLog) {
                return;
            }

            if (latestGameLog.status === "completed") {
                puzzleExpiryHandled = true;
                hideParentTimer();
                return;
            }

            if (latestGameLog.status === "expired") {
                triggerPuzzleExpiry(gameId);
                return;
            }

            if (latestGameLog.status !== "pending" || !latestGameLog.created_at) {
                return;
            }

            const createdAt = new Date(latestGameLog.created_at).getTime();
            const now = Date.now();
            const elapsedMs = now - createdAt;
            const remainingMs = 60000 - elapsedMs;

            startParentTimer(gameId, createdAt);

            if (elapsedMs >= 60000) {
                triggerPuzzleExpiry(gameId);
                return;
            }

            schedulePuzzleExpiryCheck(remainingMs, gameId);
        }

                }),

                error: function (error) {

                }
            });
        }
